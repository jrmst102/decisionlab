# ──────────────────────────────────────────────────
#  DecisionLab — Nginx reverse proxy
#  Routes traffic to the Next.js app and Negotiation Sim
#  by subdomain. Handles SSL termination via Let's Encrypt.
# ──────────────────────────────────────────────────

# ── Redirect HTTP → HTTPS ─────────────────────────
server {
    listen 80;
    server_name decisionlab.app www.decisionlab.app negotiation.decisionlab.app;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── DecisionLab (main app) ────────────────────────
server {
    listen 443 ssl;
    server_name decisionlab.app www.decisionlab.app;

    ssl_certificate     /etc/letsencrypt/live/decisionlab.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/decisionlab.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# ── Negotiation Sim ───────────────────────────────
server {
    listen 443 ssl;
    server_name negotiation.decisionlab.app;

    ssl_certificate     /etc/letsencrypt/live/decisionlab.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/decisionlab.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://negotiationsim:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
