# DigitalOcean App Platform spec
# Deploy via: doctl apps create --spec .do/app.yaml
name: decisionlab
region: nyc
services:
  - name: web
    github:
      repo: jrmst102/decisionlab
      branch: main
      deploy_on_push: true
    source_dir: app
    build_command: npx prisma generate && npm run build
    run_command: npx prisma migrate deploy && node .next/standalone/server.js
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: professional-xs
    http_port: 3000
    envs:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: TOOL_SSO_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
    routes:
      - path: /

databases:
  - name: db
    engine: PG
    version: "16"
    size: db-s-dev-database
    num_nodes: 1
